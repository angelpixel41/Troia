name: Portal de Pedidos - testes
on:
  push:
    branches:
      - feat/portal-pedidos-winthor
    paths:
      - "pedidos/**"
      - ".github/workflows/pedidos-ci.yml"
  pull_request:
    paths:
      - "pedidos/**"
      - ".github/workflows/pedidos-ci.yml"
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Usar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checar sintaxe
        run: npm --prefix pedidos run check
      - name: Executar testes
        run: npm --prefix pedidos test
